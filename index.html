                <!-- تمت إزالة اسم المطعم بناءً على طلب المستخدم -->
                <h1 class="text-4xl md:text-6xl font-extrabold text-primary-white mb-1">
                    قائمة الطعام
                </h1>
                <p class="text-lg md:text-xl text-gray-400">مأكولات مصرية أصيلة | Authentic Egyptian Cuisine</p>
            `;
            return header;
        }

        /**
         * Renders the image gallery/carousel for menu items.
         * @param {string[]} images - Array of image URLs.
         * @param {string} alt - Alt text for the image.
         * @returns {HTMLElement} The image gallery container.
         */
        function renderImageGallery(images, alt) {
            const gallery = document.createElement('div');
            // تم تقليل الارتفاع لجعل البطاقة أصغر
            gallery.className = 'relative w-full h-48 overflow-hidden rounded-t-xl shadow-lg bg-gray-800 flex items-center justify-center';

            let currentIndex = 0;

            const galleryImage = document.createElement('img');
            galleryImage.className = 'w-full h-full object-cover transition-opacity duration-500 ease-in-out';
            galleryImage.src = images[currentIndex];
            galleryImage.alt = alt;
            galleryImage.loading = "lazy";
            // Placeholder with White text on dark bg
            galleryImage.onerror = () => { galleryImage.src = 'https://placehold.co/400x300/1e1e1e/f3f4f6?text=Image+Unavailable'; }; 

            gallery.appendChild(galleryImage);

            if (images.length > 1) {
                // Navigation Logic
                const showImage = (index) => {
                    currentIndex = index;
                    galleryImage.src = images[currentIndex];
                    updateDots();
                };

                const prevButton = document.createElement('button');
                // تم تغيير لون الأيقونات إلى الأبيض
                prevButton.className = 'absolute top-1/2 -translate-y-1/2 start-2 p-2 bg-black bg-opacity-50 text-primary-white text-2xl rounded-full hover:bg-opacity-80 transition duration-300 focus:outline-none';
                prevButton.innerHTML = '&#10095;'; // RTL arrow for previous
                prevButton.setAttribute('aria-label', 'Previous image');
                prevButton.onclick = () => {
                    const newIndex = (currentIndex === 0) ? images.length - 1 : currentIndex - 1;
                    showImage(newIndex);
                };

                const nextButton = document.createElement('button');
                // تم تغيير لون الأيقونات إلى الأبيض
                nextButton.className = 'absolute top-1/2 -translate-y-1/2 end-2 p-2 bg-black bg-opacity-50 text-primary-white text-2xl rounded-full hover:bg-opacity-80 transition duration-300 focus:outline-none';
                nextButton.innerHTML = '&#10094;'; // RTL arrow for next
                nextButton.setAttribute('aria-label', 'Next image');
                nextButton.onclick = () => {
                    const newIndex = (currentIndex === images.length - 1) ? 0 : currentIndex + 1;
                    showImage(newIndex);
                };

                const dotsContainer = document.createElement('div');
                dotsContainer.className = 'absolute bottom-2 w-full text-center flex justify-center space-x-2 space-x-reverse';
                
                const updateDots = () => {
                    dotsContainer.innerHTML = '';
                    images.forEach((_, i) => {
                        const dot = document.createElement('span');
                        // تم تغيير لون النقاط إلى الأبيض
                        dot.className = `inline-block w-2.5 h-2.5 mx-1 rounded-full cursor-pointer transition-colors duration-300 ${i === currentIndex ? 'bg-primary-white shadow-md' : 'bg-primary-white/50'}`;
                        dot.onclick = () => showImage(i);
                        dotsContainer.appendChild(dot);
                    });
                };
                updateDots();

                gallery.appendChild(prevButton);
                gallery.appendChild(nextButton);
                gallery.appendChild(dotsContainer);
            }
            
            return gallery;
        }

        /**
         * Renders a single menu item card.
         * @param {object} item - Menu item data.
         * @returns {HTMLElement} The card element.
         */
        function renderMenuItem(item) {
             // تحديد عرض البطاقة بشكل متجاوب (Responsive) لمحاكاة شبكة الأعمدة من 1 إلى 6،
             // مع دعم التوسيط الذي يوفره الـ Flexbox في الحاوية الرئيسية.
            const responsiveWidths = 'w-full sm:w-[calc(50%-8px)] md:w-[calc(33.333%-10.66px)] lg:w-[calc(25%-12px)] xl:w-[calc(20%-12.8px)] 2xl:w-[calc(16.66%-13.33px)]';

            const card = document.createElement('div');
            // دمج الـ classes الجديدة للتحكم في العرض
            card.className = `bg-card-bg rounded-xl shadow-2xl transition duration-300 ease-in-out transform hover:-translate-y-2 hover:shadow-[0_0_40px_rgba(243,244,246,0.3)] flex flex-col cursor-default ${responsiveWidths}`;

            const gallery = renderImageGallery(item.image, item.name_ar);
            card.appendChild(gallery);

            const itemInfo = document.createElement('div');
            // تم تقليل padding قليلاً
            itemInfo.className = 'p-3 text-gray-100 flex flex-col justify-center flex-grow';
            
            // تم تغيير لون عنوان العنصر إلى الأبيض
            itemInfo.innerHTML = `<h3 class="text-lg font-bold text-primary-white mb-1 text-center">${item.name_ar} | ${item.name_en}</h3>`;
            
            if (item.sizes) {
                // Renders multiple sizes and prices
                item.sizes.forEach(size => {
                    const p = document.createElement('p');
                    p.className = 'text-sm text-gray-300 text-center my-0.5';
                    // تم تغيير لون السعر إلى الأحمر
                    p.innerHTML = `${size.size_ar} | ${size.size_en}: <span class="text-md text-secondary-red font-extrabold">${size.price} درهم | AED</span>`;
                    itemInfo.appendChild(p);
                });
            } else {
                // Renders single price
                const p = document.createElement('p');
                // تم تقليل حجم السعر قليلاً
                // تم تغيير لون السعر إلى الأحمر
                p.className = 'text-xl font-extrabold text-secondary-red text-center pt-1';
                p.innerHTML = `${item.price} درهم | AED`;
                itemInfo.appendChild(p);
            }
            card.appendChild(itemInfo);
            return card;
        }

        /**
         * Renders a full menu category section.
         * @param {object} category - Category data.
         * @returns {HTMLElement} The section element.
         */
        function renderMenuCategory(category) {
            const section = document.createElement('section');
            section.className = 'mb-12';
            
            // Category Hero Banner (with background image)
            const hero = document.createElement('div');
            // تم تغيير لون الإطار إلى الأبيض
            hero.className = 'relative h-48 md:h-60 rounded-2xl bg-cover bg-center shadow-xl border-4 border-primary-white overflow-hidden';
            hero.style.backgroundImage = `url(${category.image})`;
            
            const overlay = document.createElement('div');
            overlay.className = 'absolute inset-0 bg-black bg-opacity-50 flex items-end p-4 md:p-6';
            
            const titleContainer = document.createElement('div');
            titleContainer.className = 'text-right z-10';
            // تم تغيير لون العنوان إلى الأبيض
            titleContainer.innerHTML = `
                <h2 class="text-3xl md:text-4xl font-black text-primary-white">${category.category_ar}</h2>
                <h3 class="text-lg md:text-xl font-light text-gray-300">${category.category_en}</h3>
            `;
            
            overlay.appendChild(titleContainer);
            hero.appendChild(overlay);

            // Items Grid
            const itemsGrid = document.createElement('div');
            // التغيير الحاسم: استخدام flexbox مع justify-center لضمان توسيط العناصر في الصف الأخير
            itemsGrid.className = 'flex flex-wrap justify-center gap-4 mt-6';
            
            category.items.forEach(item => {
                const menuItemElement = renderMenuItem(item);
                itemsGrid.appendChild(menuItemElement);
            });
            
            section.appendChild(hero);
            section.appendChild(itemsGrid);

            return section;
        }

        /**
         * Renders the entire application, fetching the root element.
         */
        function renderApp() {
            const appContainer = document.createElement('div');
            appContainer.className = 'min-h-screen p-4 md:p-8 flex flex-col items-center';
            
            const main = document.createElement('main');
            main.className = 'w-full max-w-7xl px-2 md:px-4 pb-12';
            
            appContainer.appendChild(renderHeader());
            
            menuData.forEach(category => {
                main.appendChild(renderMenuCategory(category));
            });
            
            appContainer.appendChild(main);
            root.appendChild(appContainer);
        }

        // Initialize the app on window load
        window.onload = renderApp;
    </script>
</body>
</html>
